<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Proxmox VM Autoscale">
  <title>Proxmox VM Autoscale</title>
  <!-- A solid allocation between two chevrons: the guest grows and shrinks
       in place. Both directions matter - this service scales down too. -->
  <rect width="64" height="64" rx="14" fill="#e57000"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 20 L32 12 L42 20"/>
    <path d="M22 44 L32 52 L42 44"/>
  </g>
  <rect x="20" y="27" width="24" height="10" rx="3" fill="#fff"/>
</svg>
