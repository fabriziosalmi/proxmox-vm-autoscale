name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run that is mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # lastUpdated timestamps come from git history

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run docs:build

      - name: Verify generated artefacts
        run: |
          set -euo pipefail
          out=docs/.vitepress/dist
          for f in index.html sitemap.xml robots.txt llms.txt \
                   .well-known/security.txt favicon.svg; do
            test -s "$out/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          grep -q 'application/ld+json' "$out/index.html" \
            || { echo 'JSON-LD missing from index.html'; exit 1; }
          grep -q 'rel="canonical"' "$out/index.html" \
            || { echo 'canonical link missing from index.html'; exit 1; }
          echo "artefact check passed"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
          # v5 defaults this to false, which silently drops .well-known/ from
          # the tarball and 404s security.txt on the deployed site.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

      # Verifying the built directory is not enough: the artifact step can drop
      # files between build and publish. Check what is actually being served.
      - name: Smoke-test the deployed site
        env:
          BASE: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          sleep 10
          fail=0
          for path in "" "guide/" "reference/configuration.html" "privacy.html" \
                      "sitemap.xml" "robots.txt" "llms.txt" \
                      ".well-known/security.txt" "favicon.svg"; do
            url="${BASE%/}/$path"
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$url")
            if [ "$code" = "200" ]; then
              printf '  %-34s %s\n' "/$path" "$code"
            else
              printf '  %-34s %s  <-- FAILED\n' "/$path" "$code"
              fail=1
            fi
          done
          exit "$fail"
